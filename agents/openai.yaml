interface:
  display_name: "Rustfield RISO Graphic Redesign"
  short_description: "用编辑式几何构图与RISO印刷语言重设计任意主题"
  default_prompt: "使用 $rustfield-riso-graphic-redesign：按用户是否提供图片选择图生图或纯文生图路径，并按规定顺序读取引用文件。每个输入图默认独立重绘并各输出一张；只有用户明确要求合成时才合成。标题未指定时，仅逐图询问：不加标题、自动生成标题或自定义标题；自定义时再询问准确文案。每张图先编译为一份具体执行 Prompt：内容权威→图形构成权威→配色权威→材质权威→字体权威；明确主锚点的新位置、主体的体块转换、配色角色和少数局部印刷区域，并一次性生成。保留输入的身份、数量、动作、关系与场景骨架，分离内容、构图、造型、配色、材质和排版参考。将头发、毛发、花纹、服装纹理和重复线条收成少量平面色块；除非用户要求保留构图，否则至少做两处可见结构变化：一处改变层级，一处改变关系或节奏。必须使用项目板单一配色锚点、自然白纸底、清晰硬边与宽幅低频不规则抖动、全局不等宽留缝/纸缝/轻微套印错位、局部半调与不均匀油墨证据；RISO/丝网印刷为主，黑色最多占画布25%且目标低于20%。失败时从原始输入重新一次性生成，不做后期叠加修补。"
