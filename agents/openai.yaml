interface:
  display_name: "Rustfield RISO Graphic Redesign"
  short_description: "用编辑式几何构图与RISO印刷语言重设计任意主题"
  default_prompt: "使用 $rustfield-riso-graphic-redesign：先按用户是否提供图片选择图生图或纯文生图路径，再按规定顺序读取引用文件；保留当前输入的身份、数量、动作、关系与场景骨架，分离内容、构图、造型、配色、材质和排版参考。以编辑式几何色块和一次性完整构图生成；必须使用项目板单一配色锚点、自然白纸底、清晰硬边与宽幅低频不规则抖动、全局不等宽留缝/纸缝/轻微套印错位、局部半调与不均匀油墨证据；RISO/丝网印刷为主，黑色最多占画布25%且目标低于20%。文字按海报或显式标题要求处理，否则遵循Skill记录的文字策略；印章只取当前输入或主题锚点。失败时从原始输入重新一次性生成，不做后期叠加修补。"
