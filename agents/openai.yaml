interface:
  display_name: "Rustfield RISO Graphic Redesign"
  short_description: "用编辑式几何构图与RISO印刷语言重设计任意主题"
  default_prompt: "使用 $rustfield-riso-graphic-redesign：先按用户是否提供图片选择图生图或纯文生图路径，再按规定顺序读取引用文件；先用结构化选项弹窗确认标题需求，不要求用户手动输入；多图先弹出批量方案选项，再逐张弹出标题选项，然后根据已记录答案决定版式、留白和构图。保留当前输入的身份、数量、动作、关系与场景骨架，分离内容、构图、造型、配色、材质和排版参考。先把每个主体重建为一个主轮廓加2–5个诊断特征，再用概括门槛把头发、毛发、花纹、服装纹理和重复线条收成少量平面色块；缩略图必须读出一个主主体和1–3个辅助体块，油墨细节只保留少数局部区域。删除反光、密集纹理和非必要线稿，再写新的构图；除非用户要求保留构图，否则至少做两处可见结构变化（一处改变层级，一处改变关系/节奏），重构后的构图必须在缩略图中明显不同并让主体更清晰，颜色、滤镜或小裁切不算重构。以编辑式几何色块和一次性完整构图生成；必须使用项目板单一配色锚点、自然白纸底、清晰硬边与宽幅低频不规则抖动、全局不等宽留缝/纸缝/轻微套印错位、局部半调与不均匀油墨证据；RISO/丝网印刷为主，黑色最多占画布25%且目标低于20%。印章只取当前输入或主题锚点。失败时从原始输入重新一次性生成，不做后期叠加修补。"
